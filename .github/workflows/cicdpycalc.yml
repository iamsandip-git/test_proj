name: Build, Push, and Deploy Locally

on:
  push:
    branches:
      - main  # Trigger the workflow on pushes to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${ secrets.DOCKER_USERNAME }
          password: ${ secrets.DOCKER_PASSWORD }

      - name: Build and Push Docker Image
        run: |
          docker build -t myusername/calculator-app:latest .
          docker push myusername/calculator-app:latest

  deploy-locally:
    runs-on: self-hosted  # Run on a self-hosted runner
    needs: build-and-push
    steps:
      - name: Pull and Deploy Docker Image
        run: |
          docker pull myusername/calculator-app:latest
          docker stop calculator-app || true
          docker rm calculator-app || true
          docker run -d -p 5000:5000 --name calculator-app myusername/calculator-app:latest
